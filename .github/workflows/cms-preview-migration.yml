name: Apply CMS Migration to Preview D1

on:
  push:
    branches: [cms-development]
    paths:
      - migrations/0002_create_cms.sql
      - migrations/0003_page_metadata_versions.sql
      - migrations/0005_page_section_recovery.sql
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cms-preview-d1-migration
  cancel-in-progress: false

jobs:
  migrate-preview:
    name: Apply CMS schema to yr-proservice-test-db only
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/cms-development'
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Preview database identity (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@4.157.0 d1 info yr-proservice-test-db --json > d1-preview-info.json
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const expectedName = 'yr-proservice-test-db';
          const expectedId = '7fca4ad0-3baa-4148-ad28-bfd2ef416c16';
          let info;
          try {
            info = JSON.parse(fs.readFileSync('d1-preview-info.json', 'utf8'));
          } catch (error) {
            throw new Error('Could not parse Wrangler D1 info JSON; refusing to run migration.');
          }

          const values = [];
          const visit = (value) => {
            if (typeof value === 'string') values.push(value);
            else if (Array.isArray(value)) value.forEach(visit);
            else if (value && typeof value === 'object') Object.values(value).forEach(visit);
          };
          visit(info);

          if (!values.includes(expectedName) || !values.includes(expectedId)) {
            throw new Error(
              'Preview D1 identity mismatch. Expected database name ' +
              expectedName + ' and UUID ' + expectedId +
              '. Refusing to execute SQL.'
            );
          }

          console.log('Verified Preview D1 identity:', expectedName, expectedId);
          NODE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply CMS migration to Preview database
        run: |
          npx wrangler@4.157.0 d1 execute yr-proservice-test-db --remote --file=migrations/0002_create_cms.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify CMS tables exist in Preview database
        run: |
          npx wrangler@4.157.0 d1 execute yr-proservice-test-db --remote --command "SELECT name FROM sqlite_master WHERE type = 'table' AND name LIKE 'cms_%' ORDER BY name;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply page metadata migration to Preview database
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=commonjs <<'NODE'
          const { execFileSync } = require('node:child_process');

          const database = 'yr-proservice-test-db';
          const wrangler = [
            'wrangler@4.157.0',
            'd1',
            'execute',
            database,
            '--remote',
          ];
          const inspectSql = [
            "SELECT",
            "  (SELECT COUNT(*) FROM pragma_table_info('cms_page_versions') WHERE name = 'title') AS has_title,",
            "  (SELECT COUNT(*) FROM pragma_table_info('cms_page_versions') WHERE name = 'route') AS has_route",
          ].join(' ');

          const raw = execFileSync('npx', [...wrangler, '--command', inspectSql, '--json'], {
            encoding: 'utf8',
            stdio: ['ignore', 'pipe', 'inherit'],
          });
          let parsed;
          try {
            parsed = JSON.parse(raw);
          } catch {
            throw new Error('Could not parse Preview page-metadata schema inspection; refusing to migrate.');
          }

          const resultSets = Array.isArray(parsed) ? parsed : [parsed];
          const rows = resultSets.flatMap((result) => Array.isArray(result?.results) ? result.results : []);
          if (rows.length !== 1) {
            throw new Error('Preview page-metadata inspection returned an unexpected result; refusing to migrate.');
          }

          const hasTitle = Number(rows[0].has_title) === 1;
          const hasRoute = Number(rows[0].has_route) === 1;
          if (hasTitle !== hasRoute) {
            throw new Error('Preview page-metadata schema is partially migrated; refusing automatic repair.');
          }

          if (!hasTitle) {
            console.log('Applying missing page metadata columns and backfill.');
            execFileSync('npx', [...wrangler, '--file=migrations/0003_page_metadata_versions.sql'], { stdio: 'inherit' });
          } else {
            console.log('Page metadata columns already exist; safely completing null backfill and index creation.');
            const repairSql = [
              "UPDATE cms_page_versions",
              "SET title = (SELECT title FROM cms_pages WHERE cms_pages.id = cms_page_versions.page_id),",
              "    route = (SELECT route FROM cms_pages WHERE cms_pages.id = cms_page_versions.page_id)",
              "WHERE title IS NULL OR route IS NULL;",
              "CREATE INDEX IF NOT EXISTS idx_cms_page_versions_route_state",
              "ON cms_page_versions(route, state);",
            ].join(' ');
            execFileSync('npx', [...wrangler, '--command', repairSql], { stdio: 'inherit' });
          }
          NODE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify page metadata migration in Preview database
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@4.157.0 d1 execute yr-proservice-test-db --remote --command "SELECT (SELECT COUNT(*) FROM pragma_table_info('cms_page_versions') WHERE name = 'title') AS title_column, (SELECT COUNT(*) FROM pragma_table_info('cms_page_versions') WHERE name = 'route') AS route_column, (SELECT COUNT(*) FROM sqlite_master WHERE type = 'index' AND name = 'idx_cms_page_versions_route_state') AS route_index, (SELECT COUNT(*) FROM cms_page_versions WHERE title IS NULL OR route IS NULL) AS null_metadata;" --json > page-metadata-verification.json
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const parsed = JSON.parse(fs.readFileSync('page-metadata-verification.json', 'utf8'));
          const resultSets = Array.isArray(parsed) ? parsed : [parsed];
          const rows = resultSets.flatMap((result) => Array.isArray(result?.results) ? result.results : []);
          if (rows.length !== 1) throw new Error('Preview page metadata verification returned an unexpected result.');
          const row = rows[0];
          if (Number(row.title_column) !== 1 || Number(row.route_column) !== 1 ||
              Number(row.route_index) !== 1 || Number(row.null_metadata) !== 0) {
            throw new Error('Preview page metadata migration verification failed: ' + JSON.stringify(row));
          }
          console.log('Verified Preview page metadata columns, index and backfill:', row);
          NODE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply section recovery migration to Preview database
        run: |
          npx wrangler@4.157.0 d1 execute yr-proservice-test-db --remote --file=migrations/0005_page_section_recovery.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify section recovery migration in Preview database
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@4.157.0 d1 execute yr-proservice-test-db --remote --command "SELECT (SELECT COUNT(*) FROM sqlite_master WHERE type = 'table' AND name = 'cms_page_section_recovery') AS recovery_table, (SELECT COUNT(*) FROM sqlite_master WHERE type = 'index' AND name = 'idx_cms_page_section_recovery_page_status') AS recovery_index;" --json > recovery-schema-verification.json
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const parsed = JSON.parse(fs.readFileSync('recovery-schema-verification.json', 'utf8'));
          const resultSets = Array.isArray(parsed) ? parsed : [parsed];
          const rows = resultSets.flatMap((result) => Array.isArray(result?.results) ? result.results : []);
          if (rows.length !== 1 || Number(rows[0].recovery_table) !== 1 ||
              Number(rows[0].recovery_index) !== 1) {
            throw new Error('Preview section recovery schema verification failed: ' + JSON.stringify(rows));
          }
          console.log('Verified Preview section recovery table and index.');
          NODE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
