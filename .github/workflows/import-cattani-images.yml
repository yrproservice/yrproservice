name: Import verified Cattani product images

on:
  push:
    branches: [cms-development]
    paths:
      - ".github/workflows/import-cattani-images.yml"
      - "scripts/import-cattani-images.mjs"

permissions:
  contents: write
  actions: write

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out cms-development
        uses: actions/checkout@v4
        with:
          ref: cms-development
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download and validate exact-model images
        run: node scripts/import-cattani-images.mjs
      - name: Commit verified product images and catalogue references
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/catalog/cattani/images/ac-400-q.* public/catalog/cattani/images/ac-600-q.* src/data/products.js src/data/catalogMedia.js
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new verified product images were downloaded."
            exit 0
          fi
          git commit -m "assets: add verified Cattani AC400Q and AC600Q images"
          git push origin HEAD:cms-development
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger full Preview verification for the image commit
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/yrproservice/yrproservice/actions/workflows/cms-build-check.yml/dispatches \
            -d '{"ref":"cms-development"}'
