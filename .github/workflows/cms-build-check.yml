name: CMS Preview Build Check

# Phase G is source-only. Keep the final verification workflow available for
# explicit manual dispatch during Phase H; do not run tests/builds on each
# intermediate commit or while the PR is still under development.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Install and build website
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run automated checks
        run: npm test
      - name: Build Vite website
        run: npm run build
