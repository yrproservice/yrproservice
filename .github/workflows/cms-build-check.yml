name: CMS Preview Build Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [cms-development]

permissions:
  contents: read

jobs:
  build:
    name: Install and build website
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run automated checks
        run: npm test
      - name: Build Vite website
        run: npm run build
