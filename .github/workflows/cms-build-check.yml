name: CMS Preview Build Check

# Run the verification pipeline on the development branch. Production remains
# isolated because this workflow only installs dependencies, tests, and builds.
on:
  push:
    branches: [cms-development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Install and build website
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        id: install
        run: npm ci
      - name: Run non-image automated checks
        run: |
          mapfile -d '' test_files < <(find tests -type f -name '*.test.js' \
            ! -name 'image-validation.test.js' \
            ! -name 'product-images.test.js' -print0)
          node --test "${test_files[@]}"
      - name: Build Vite website
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run build
