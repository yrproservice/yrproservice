name: CMS Preview Build Check

# Run automated tests, Preview build/deployment verification, and desktop viewport screenshot capture.
# Image processing remains intentionally excluded.
on:
  push:
    branches: [cms-development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cms-preview-build
  cancel-in-progress: true

jobs:
  build:
    name: Install, test and build website
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/cms-development'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        id: install
        run: npm ci
      - name: Audit locked npm dependencies
        if: ${{ steps.install.outcome == 'success' }}
        run: npm audit --audit-level=high
      - name: Run automated tests
        if: ${{ steps.install.outcome == 'success' }}
        run: npm test
      - name: Build Vite website
        if: ${{ success() }}
        run: npm run build
      - name: Build Cloudflare Pages Functions
        if: success()
        run: npx wrangler@4.157.0 pages functions build
      - name: Verify Preview D1 schema readiness
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@4.157.0 d1 execute yr-proservice-test-db --remote --command "SELECT (SELECT COUNT(*) FROM pragma_table_info('cms_page_versions') WHERE name = 'title') AS title_column, (SELECT COUNT(*) FROM pragma_table_info('cms_page_versions') WHERE name = 'route') AS route_column, (SELECT COUNT(*) FROM sqlite_master WHERE type = 'index' AND name = 'idx_cms_page_versions_route_state') AS route_index, (SELECT COUNT(*) FROM cms_page_versions WHERE title IS NULL OR route IS NULL) AS null_metadata, (SELECT COUNT(*) FROM sqlite_master WHERE type = 'table' AND name IN ('request_submission_attempts', 'request_tracking_attempts')) AS rate_limit_tables, (SELECT COUNT(*) FROM pragma_table_info('request_submission_attempts') WHERE name IN ('id', 'ip_hash', 'email_hash', 'created_at')) AS submission_columns, (SELECT COUNT(*) FROM pragma_table_info('request_tracking_attempts') WHERE name IN ('id', 'ip_hash', 'email_hash', 'created_at')) AS tracking_columns, (SELECT COUNT(*) FROM sqlite_master WHERE type = 'index' AND name IN ('idx_request_submission_ip_time', 'idx_request_submission_email_time', 'idx_request_tracking_ip_time', 'idx_request_tracking_email_time')) AS rate_limit_indexes;" --json > preview-schema.json
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const parsed = JSON.parse(fs.readFileSync('preview-schema.json', 'utf8'));
          const resultSets = Array.isArray(parsed) ? parsed : [parsed];
          const rows = resultSets.flatMap((result) => Array.isArray(result?.results) ? result.results : []);
          if (rows.length !== 1) throw new Error('Preview schema check returned an unexpected result.');
          const row = rows[0];
          if (Number(row.title_column) !== 1 || Number(row.route_column) !== 1 ||
              Number(row.route_index) !== 1 || Number(row.null_metadata) !== 0 ||
              Number(row.rate_limit_tables) !== 2 || Number(row.submission_columns) !== 4 ||
              Number(row.tracking_columns) !== 4 || Number(row.rate_limit_indexes) !== 4) {
            throw new Error('Preview D1 is not release-ready: ' + JSON.stringify(row));
          }
          console.log('Preview D1 schema is ready:', row);
          NODE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy or verify Cloudflare Pages Preview
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_PAGES_API_TOKEN:-}" ]; then
            CLOUDFLARE_API_TOKEN="$CLOUDFLARE_PAGES_API_TOKEN" npx wrangler@4.157.0 pages deploy dist --project-name=yrproservice --branch=cms-development --commit-hash="$GITHUB_SHA"
            exit 0
          fi

          echo "No dedicated Pages deployment token is configured; checking the Git-integrated Preview branch for this exact build."
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error "https://cms-development.yrproservice.pages.dev/" --output preview-index.html; then
              if node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const local = fs.readFileSync('dist/index.html', 'utf8');
          const preview = fs.readFileSync('preview-index.html', 'utf8');
          const assets = (html) => [...html.matchAll(/(?:src|href)="([^"]*\/assets\/[^"]+)"/g)]
            .map((match) => match[1])
            .sort();
          const expected = assets(local);
          const actual = assets(preview);
          if (expected.length === 0 || expected.join("\n") !== actual.join("\n")) {
            process.exit(1);
          }
          (async () => {
            const origin = 'https://cms-development.yrproservice.pages.dev';
            for (const asset of expected) {
              const response = await fetch(new URL(asset, origin));
              if (!response.ok) throw new Error('Preview asset failed to load: ' + asset + ' (' + response.status + ')');
            }
            console.log('Preview branch is serving this build and all ' + expected.length + ' referenced JS/CSS assets returned successfully.');
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
              then
                exit 0
              fi
            fi
            echo "Preview deployment not matched yet (attempt $attempt/18)."
            sleep 10
          done

          echo "::error::Preview deployment could not be matched to this build. Add CLOUDFLARE_PAGES_API_TOKEN with Account Cloudflare Pages Edit and User Memberships Read to enable direct Preview upload."
          exit 1
        env:
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Audit Preview security headers and Access boundaries
        if: success()
        run: node scripts/preview-security-audit.mjs
      - name: Informational audit of Preview product image fields (non-blocking)
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const origin = 'https://cms-development.yrproservice.pages.dev';
          const slugs = [
            'mocom-v10',
            'mocom-f10',
            'mocom-goldspeed-evo-e4',
            'westcode-ap31',
            'westcode-ja20',
          ];
          const response = await fetch(origin + '/api/cms/public/products', { cache: 'no-store' });
          if (!response.ok) {
            throw new Error('Preview public catalogue request failed: HTTP ' + response.status);
          }
          const data = await response.json();
          if (!data?.ok || !Array.isArray(data.products)) {
            throw new Error('Preview public catalogue returned an invalid response.');
          }
          const bySlug = new Map(data.products.map((product) => [product.slug, product]));
          const report = slugs.map((slug) => {
            const product = bySlug.get(slug);
            return {
              slug,
              published: Boolean(product),
              archived: Array.isArray(data.archivedSlugs) && data.archivedSlugs.includes(slug),
              image: typeof product?.img === 'string' ? product.img : null,
            };
          });
          const fs = await import('node:fs/promises');
          await fs.writeFile('preview-product-image-audit.json', JSON.stringify(report, null, 2) + '\\n');
          const summary = [
            '### Preview published product image audit',
            '',
            '| Product slug | Published | Archived | Published image |',
            '|---|---:|---:|---|',
            ...report.map((item) => '| ' + item.slug + ' | ' + item.published + ' | ' + item.archived + ' | ' + (item.image || '(empty)') + ' |'),
            '',
          ].join('\\n');
          await fs.appendFile(process.env.GITHUB_STEP_SUMMARY, summary);
          for (const item of report) console.log(JSON.stringify(item));
          NODE
      - name: Upload Preview product image audit
        if: always() && hashFiles('preview-product-image-audit.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: preview-product-image-audit-${{ github.sha }}
          path: preview-product-image-audit.json
          if-no-files-found: error
          retention-days: 7
      - name: Informational check of existing static catalogue image URLs (non-blocking)
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const origin = 'https://cms-development.yrproservice.pages.dev';
          const paths = [
            '/catalog/enhanced/mocom/dental%20chair/mocom%20v10.jpg',
            '/catalog/enhanced/mocom/dental%20chair/mocom%20f10.jpg',
            '/catalog/mocom/handpiece/mocom%20goldspeed%20evo%20e4.jfif',
            '/catalog/westcode/handpiece/westcode%20ap31.jfif',
            '/catalog/westcode/handpiece/westcode%20ja20.webp',
          ];
          const results = [];
          for (const path of paths) {
            const response = await fetch(new URL(path, origin), { method: 'GET', cache: 'no-store' });
            const bytes = new Uint8Array(await response.arrayBuffer());
            const isJpeg = bytes.length >= 3 && bytes[0] === 0xff && bytes[1] === 0xd8 && bytes[2] === 0xff;
            const isPng = bytes.length >= 8 && [0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a].every((value, index) => bytes[index] === value);
            const isWebp = bytes.length >= 12 &&
              String.fromCharCode(...bytes.slice(0, 4)) === 'RIFF' &&
              String.fromCharCode(...bytes.slice(8, 12)) === 'WEBP';
            const result = {
              path,
              status: response.status,
              contentType: response.headers.get('content-type'),
              contentLength: response.headers.get('content-length'),
              signature: isJpeg ? 'jpeg' : isPng ? 'png' : isWebp ? 'webp' : 'unknown',
              validImageBytes: isJpeg || isPng || isWebp,
            };
            results.push(result);
            console.log(JSON.stringify(result));
            if (!response.ok || !result.validImageBytes) {
              throw new Error('Preview static catalogue image failed byte validation: ' + path + ' (' + response.status + ', ' + result.signature + ', ' + result.contentType + ')');
            }
          }
          const fs = await import('node:fs/promises');
          await fs.writeFile('preview-static-image-url-audit.json', JSON.stringify(results, null, 2) + '\\n');
          await fs.appendFile(process.env.GITHUB_STEP_SUMMARY, [
            '### Preview static catalogue image URL audit',
            '',
            '| Asset path | HTTP | Content type |',
            '|---|---:|---|',
            ...results.map((item) => '| ' + item.path + ' | ' + item.status + ' | ' + item.contentType + ' |'),
            '',
          ].join('\\n'));
          NODE
      - name: Upload Preview static image URL audit
        if: always() && hashFiles('preview-static-image-url-audit.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: preview-static-image-url-audit-${{ github.sha }}
          path: preview-static-image-url-audit.json
          if-no-files-found: error
          retention-days: 7
      - name: Install Playwright for Preview browser audits
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: Capture Preview desktop and mobile screenshots
        if: success()
        id: screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview-screenshots/desktop preview-screenshots/mobile
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const origin = 'https://cms-development.yrproservice.pages.dev';
          const routes = [
            ['home', '/'],
            ['products', '/products'],
            ['services', '/services'],
            ['team', '/team'],
            ['product-signo-t100', '/products/signo-t100'],
            ['hr-contact', '/contact'],
            ['product-cart', '/cart'],
            ['quotation', '/quote'],
            ['dental-chair-request', '/dental-chair-request'],
            ['service-request', '/service-request'],
          ];
          const viewports = [
            {
              name: 'desktop',
              options: { viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 },
            },
            {
              name: 'mobile',
              options: {
                viewport: { width: 390, height: 844 },
                deviceScaleFactor: 2,
                isMobile: true,
                hasTouch: true,
              },
            },
          ];
          const browser = await chromium.launch({ headless: true });
          try {
            for (const viewport of viewports) {
              const page = await browser.newPage(viewport.options);
              page.setDefaultNavigationTimeout(20000);
              for (const [name, route] of routes) {
                const response = await page.goto(origin + route, { waitUntil: 'domcontentloaded' });
                if (!response || response.status() >= 400) {
                  throw new Error(viewport.name + ' Preview page failed: ' + route + ' (' + (response?.status() ?? 'no response') + ')');
                }
                await page.waitForLoadState('networkidle', { timeout: 5000 }).catch(() => {});
                await page.evaluate(() => document.fonts?.ready);
                await page.evaluate(async () => {
                  // Force lazy catalogue images to request before full-page capture.
                  for (const image of document.images) image.loading = 'eager';
                  const step = Math.max(400, Math.floor(window.innerHeight * 0.75));
                  const height = document.documentElement.scrollHeight;
                  for (let y = 0; y < height; y += step) {
                    window.scrollTo(0, y);
                    await new Promise((resolve) => setTimeout(resolve, 120));
                  }
                  // Cancel any in-flight smooth scroll and force the capture to the document origin.
                  document.documentElement.style.setProperty('scroll-behavior', 'auto', 'important');
                  document.body.style.setProperty('scroll-behavior', 'auto', 'important');
                  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
                  if (document.scrollingElement) document.scrollingElement.scrollTop = 0;
                  window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
                  await new Promise((resolve) => requestAnimationFrame(() =>
                    requestAnimationFrame(resolve)
                  ));
                  if (window.scrollY !== 0) {
                    if (document.scrollingElement) document.scrollingElement.scrollTop = 0;
                    await new Promise((resolve) => requestAnimationFrame(resolve));
                  }

                  // A lazy image can remain incomplete without emitting load/error.
                  // Bound both waits so one stalled request cannot block the audit.
                  const imageLoads = Promise.all(Array.from(document.images, (image) =>
                    image.complete ? Promise.resolve() : new Promise((resolve) => {
                      image.addEventListener('load', resolve, { once: true });
                      image.addEventListener('error', resolve, { once: true });
                    })
                  ));
                  await Promise.race([
                    imageLoads,
                    new Promise((resolve) => setTimeout(resolve, 15000)),
                  ]);
                  await Promise.race([
                    Promise.all(Array.from(document.images, (image) => image.decode?.().catch(() => {}))),
                    new Promise((resolve) => setTimeout(resolve, 5000)),
                  ]);
                });
                await page.waitForTimeout(300);
                const dimensions = await page.evaluate(() => ({
                  viewportWidth: window.innerWidth,
                  scrollY: window.scrollY,
                  documentWidth: document.documentElement.scrollWidth,
                  documentHeight: document.documentElement.scrollHeight,
                  imageCount: document.images.length,
                  loadedImageCount: Array.from(document.images).filter((image) => image.complete && image.naturalWidth > 0).length,
                  failedImageCount: Array.from(document.images).filter((image) => image.currentSrc && image.complete && image.naturalWidth === 0).length,
                  missingImageSourceCount: Array.from(document.images).filter((image) => !image.currentSrc && !image.getAttribute('src')).length,
                  pendingImageCount: Array.from(document.images).filter((image) => image.currentSrc && !image.complete).length,
                }));
                await page.screenshot({
                  path: 'preview-screenshots/' + viewport.name + '/' + name + '.png',
                  fullPage: true,
                });
                console.log('Captured', viewport.name, route, response.status(), JSON.stringify(dimensions));
              }
              await page.close();
            }
          } finally {
            await browser.close();
          }
          NODE
      - name: Audit Preview customer request journeys
        if: success()
        shell: bash
        env:
          PREVIEW_BASE_URL: https://cms-development.yrproservice.pages.dev
        run: node scripts/preview-customer-flow-audit.mjs
      - name: Upload Preview customer-flow audit
        if: always() && hashFiles('preview-customer-flow-audit.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: preview-customer-flow-audit-${{ github.sha }}
          path: preview-customer-flow-audit.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload Preview screenshots
        if: always() && hashFiles('preview-screenshots/**/*.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: cms-preview-screenshots-${{ github.sha }}
          path: preview-screenshots/**/*.png
          if-no-files-found: error
          retention-days: 7
