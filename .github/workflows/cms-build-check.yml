name: CMS Preview Build Check

# Run automated tests, Preview build/deployment verification, and desktop viewport screenshot capture.
# Image processing remains intentionally excluded.
on:
  push:
    branches: [cms-development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cms-preview-build
  cancel-in-progress: true

jobs:
  build:
    name: Install, test and build website
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        id: install
        run: npm ci
      - name: Run automated tests
        if: ${{ steps.install.outcome == 'success' }}
        run: npm test
      - name: Build Vite website
        if: ${{ success() }}
        run: npm run build
      - name: Build Cloudflare Pages Functions
        if: success()
        run: npx wrangler@4.157.0 pages functions build
      - name: Verify Preview D1 schema readiness
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@4.157.0 d1 execute yr-proservice-test-db --remote --command "SELECT (SELECT COUNT(*) FROM pragma_table_info('cms_page_versions') WHERE name = 'title') AS title_column, (SELECT COUNT(*) FROM pragma_table_info('cms_page_versions') WHERE name = 'route') AS route_column, (SELECT COUNT(*) FROM sqlite_master WHERE type = 'index' AND name = 'idx_cms_page_versions_route_state') AS route_index, (SELECT COUNT(*) FROM cms_page_versions WHERE title IS NULL OR route IS NULL) AS null_metadata;" --json > preview-schema.json
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const parsed = JSON.parse(fs.readFileSync('preview-schema.json', 'utf8'));
          const resultSets = Array.isArray(parsed) ? parsed : [parsed];
          const rows = resultSets.flatMap((result) => Array.isArray(result?.results) ? result.results : []);
          if (rows.length !== 1) throw new Error('Preview schema check returned an unexpected result.');
          const row = rows[0];
          if (Number(row.title_column) !== 1 || Number(row.route_column) !== 1 ||
              Number(row.route_index) !== 1 || Number(row.null_metadata) !== 0) {
            throw new Error('Preview D1 is not release-ready: ' + JSON.stringify(row));
          }
          console.log('Preview D1 schema is ready:', row);
          NODE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy or verify Cloudflare Pages Preview
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_PAGES_API_TOKEN:-}" ]; then
            CLOUDFLARE_API_TOKEN="$CLOUDFLARE_PAGES_API_TOKEN" npx wrangler@4.157.0 pages deploy dist --project-name=yrproservice --branch=cms-development --commit-hash="$GITHUB_SHA"
            exit 0
          fi

          echo "No dedicated Pages deployment token is configured; checking the Git-integrated Preview branch for this exact build."
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error "https://cms-development.yrproservice.pages.dev/" --output preview-index.html; then
              if node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const local = fs.readFileSync('dist/index.html', 'utf8');
          const preview = fs.readFileSync('preview-index.html', 'utf8');
          const assets = (html) => [...html.matchAll(/(?:src|href)="([^"]*\/assets\/[^"]+)"/g)]
            .map((match) => match[1])
            .sort();
          const expected = assets(local);
          const actual = assets(preview);
          if (expected.length === 0 || expected.join("\n") !== actual.join("\n")) {
            process.exit(1);
          }
          (async () => {
            const origin = 'https://cms-development.yrproservice.pages.dev';
            for (const asset of expected) {
              const response = await fetch(new URL(asset, origin));
              if (!response.ok) throw new Error('Preview asset failed to load: ' + asset + ' (' + response.status + ')');
            }
            console.log('Preview branch is serving this build and all ' + expected.length + ' referenced JS/CSS assets returned successfully.');
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
              then
                exit 0
              fi
            fi
            echo "Preview deployment not matched yet (attempt $attempt/18)."
            sleep 10
          done

          echo "::error::Preview deployment could not be matched to this build. Add CLOUDFLARE_PAGES_API_TOKEN with Account Cloudflare Pages Edit and User Memberships Read to enable direct Preview upload."
          exit 1
        env:
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Audit Preview published product image fields
        if: success()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const origin = 'https://cms-development.yrproservice.pages.dev';
          const slugs = [
            'mocom-v10',
            'mocom-f10',
            'mocom-goldspeed-evo-e4',
            'westcode-ap31',
            'westcode-ja20',
          ];
          const response = await fetch(origin + '/api/cms/public/products', { cache: 'no-store' });
          if (!response.ok) {
            throw new Error('Preview public catalogue request failed: HTTP ' + response.status);
          }
          const data = await response.json();
          if (!data?.ok || !Array.isArray(data.products)) {
            throw new Error('Preview public catalogue returned an invalid response.');
          }
          const bySlug = new Map(data.products.map((product) => [product.slug, product]));
          const report = slugs.map((slug) => {
            const product = bySlug.get(slug);
            return {
              slug,
              published: Boolean(product),
              archived: Array.isArray(data.archivedSlugs) && data.archivedSlugs.includes(slug),
              image: typeof product?.img === 'string' ? product.img : null,
            };
          });
          const fs = await import('node:fs/promises');
          await fs.writeFile('preview-product-image-audit.json', JSON.stringify(report, null, 2) + '\\n');
          const summary = [
            '### Preview published product image audit',
            '',
            '| Product slug | Published | Archived | Published image |',
            '|---|---:|---:|---|',
            ...report.map((item) => '| ' + item.slug + ' | ' + item.published + ' | ' + item.archived + ' | ' + (item.image || '(empty)') + ' |'),
            '',
          ].join('\\n');
          await fs.appendFile(process.env.GITHUB_STEP_SUMMARY, summary);
          for (const item of report) console.log(JSON.stringify(item));
          NODE
      - name: Upload Preview product image audit
        if: always() && hashFiles('preview-product-image-audit.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: preview-product-image-audit-${{ github.sha }}
          path: preview-product-image-audit.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify affected static catalogue image URLs
        if: success()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const origin = 'https://cms-development.yrproservice.pages.dev';
          const paths = [
            '/catalog/enhanced/mocom/dental%20chair/mocom%20v10.jpg',
            '/catalog/enhanced/mocom/dental%20chair/mocom%20f10.jpg',
            '/catalog/mocom/handpiece/mocom%20goldspeed%20evo%20e4.jfif',
            '/catalog/westcode/handpiece/westcode%20ap31.jfif',
            '/catalog/westcode/handpiece/westcode%20ja20.webp',
          ];
          const results = [];
          for (const path of paths) {
            const response = await fetch(new URL(path, origin), { method: 'GET', cache: 'no-store' });
            const result = {
              path,
              status: response.status,
              contentType: response.headers.get('content-type'),
              contentLength: response.headers.get('content-length'),
            };
            results.push(result);
            console.log(JSON.stringify(result));
            if (!response.ok || !/^image\//i.test(result.contentType || '')) {
              throw new Error('Preview static catalogue image failed: ' + path + ' (' + response.status + ', ' + result.contentType + ')');
            }
            await response.arrayBuffer();
          }
          const fs = await import('node:fs/promises');
          await fs.writeFile('preview-static-image-url-audit.json', JSON.stringify(results, null, 2) + '\\n');
          await fs.appendFile(process.env.GITHUB_STEP_SUMMARY, [
            '### Preview static catalogue image URL audit',
            '',
            '| Asset path | HTTP | Content type |',
            '|---|---:|---|',
            ...results.map((item) => '| ' + item.path + ' | ' + item.status + ' | ' + item.contentType + ' |'),
            '',
          ].join('\\n'));
          NODE
      - name: Upload Preview static image URL audit
        if: always() && hashFiles('preview-static-image-url-audit.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: preview-static-image-url-audit-${{ github.sha }}
          path: preview-static-image-url-audit.json
          if-no-files-found: error
          retention-days: 7
      - name: Capture Preview desktop and mobile screenshots
        if: success()
        id: screenshots
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium --with-deps
          mkdir -p preview-screenshots/desktop preview-screenshots/mobile
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const origin = 'https://cms-development.yrproservice.pages.dev';
          const routes = [
            ['home', '/'],
            ['products', '/products'],
            ['services', '/services'],
            ['team', '/team'],
            ['product-signo-t100', '/products/signo-t100'],
            ['hr-contact', '/contact'],
            ['product-cart', '/cart'],
            ['quotation', '/quote'],
            ['dental-chair-request', '/dental-chair-request'],
            ['service-request', '/service-request'],
          ];
          const viewports = [
            {
              name: 'desktop',
              options: { viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 },
            },
            {
              name: 'mobile',
              options: {
                viewport: { width: 390, height: 844 },
                deviceScaleFactor: 2,
                isMobile: true,
                hasTouch: true,
              },
            },
          ];
          const browser = await chromium.launch({ headless: true });
          try {
            for (const viewport of viewports) {
              const page = await browser.newPage(viewport.options);
              page.setDefaultNavigationTimeout(20000);
              for (const [name, route] of routes) {
                const response = await page.goto(origin + route, { waitUntil: 'domcontentloaded' });
                if (!response || response.status() >= 400) {
                  throw new Error(viewport.name + ' Preview page failed: ' + route + ' (' + (response?.status() ?? 'no response') + ')');
                }
                await page.waitForLoadState('networkidle', { timeout: 5000 }).catch(() => {});
                await page.evaluate(() => document.fonts?.ready);
                await page.waitForTimeout(500);
                const dimensions = await page.evaluate(() => ({
                  viewportWidth: window.innerWidth,
                  documentWidth: document.documentElement.scrollWidth,
                  documentHeight: document.documentElement.scrollHeight,
                }));
                await page.screenshot({
                  path: 'preview-screenshots/' + viewport.name + '/' + name + '.png',
                  fullPage: true,
                });
                console.log('Captured', viewport.name, route, response.status(), JSON.stringify(dimensions));
              }
              await page.close();
            }
          } finally {
            await browser.close();
          }
          NODE
      - name: Upload Preview screenshots
        if: always() && steps.screenshots.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: cms-preview-screenshots-${{ github.sha }}
          path: preview-screenshots/**/*.png
          if-no-files-found: error
          retention-days: 7
