name: Apply Customer Request Access Migration to Preview D1

on:
  push:
    branches: [cms-development]
    paths:
      - migrations/0006_customer_request_access.sql
      - migrations/0007_customer_request_session_email.sql
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customer-request-access-preview-d1-migration
  cancel-in-progress: false

jobs:
  migrate-preview:
    name: Apply customer access schema to yr-proservice-test-db only
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/cms-development'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Verify Preview database identity (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@4.157.0 d1 info yr-proservice-test-db --json > d1-preview-info.json
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const expectedName = 'yr-proservice-test-db';
          const expectedId = '7fca4ad0-3baa-4148-ad28-bfd2ef416c16';
          const info = JSON.parse(fs.readFileSync('d1-preview-info.json', 'utf8'));
          const values = [];
          const visit = (value) => {
            if (typeof value === 'string') values.push(value);
            else if (Array.isArray(value)) value.forEach(visit);
            else if (value && typeof value === 'object') Object.values(value).forEach(visit);
          };
          visit(info);
          if (!values.includes(expectedName) || !values.includes(expectedId)) {
            throw new Error('Preview D1 identity mismatch. Refusing to execute SQL.');
          }
          console.log('Verified Preview D1 identity:', expectedName, expectedId);
          NODE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply customer request access migration to Preview only
        run: npx wrangler@4.157.0 d1 execute yr-proservice-test-db --remote --file=migrations/0006_customer_request_access.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check whether customer session email column exists
        id: customer-session-email-column
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@4.157.0 d1 execute yr-proservice-test-db --remote --command "SELECT COUNT(*) AS email_column FROM pragma_table_info('customer_request_access_sessions') WHERE name = 'email';" --json > customer-session-email-column.json
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const parsed = JSON.parse(fs.readFileSync('customer-session-email-column.json', 'utf8'));
          const sets = Array.isArray(parsed) ? parsed : [parsed];
          const rows = sets.flatMap((item) => Array.isArray(item?.results) ? item.results : []);
          if (rows.length !== 1) throw new Error('Customer session email-column check returned an unexpected result.');
          const count = Number(rows[0].email_column);
          if (count !== 0 && count !== 1) throw new Error('Customer session email-column check returned an invalid count.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'present=' + (count === 1 ? 'true' : 'false') + '\n');
          console.log('Customer session email column present:', count === 1);
          NODE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply customer session email migration to Preview only
        if: steps.customer-session-email-column.outputs.present == 'false'
        run: npx wrangler@4.157.0 d1 execute yr-proservice-test-db --remote --file=migrations/0007_customer_request_session_email.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify customer access schema
        shell: bash
        run: |
          set -euo pipefail
          verification_sql="$(cat <<'SQL'
          SELECT
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='customer_request_access_codes') AS codes_table,
            (SELECT COUNT(*) FROM pragma_table_info('customer_request_access_codes') WHERE name IN ('id','email_hash','code_hash','ip_hash','attempts','created_at','expires_at','consumed_at')) AS code_columns,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='customer_request_access_sessions') AS sessions_table,
            (SELECT COUNT(*) FROM pragma_table_info('customer_request_access_sessions') WHERE name IN ('token_hash','email_hash','created_at','expires_at','email')) AS session_columns,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name='idx_customer_request_codes_email_created') AS email_index,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name='idx_customer_request_codes_ip_created') AS ip_index,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name='idx_customer_request_sessions_email_expiry') AS session_index;
          SQL
          )"
          npx wrangler@4.157.0 d1 execute yr-proservice-test-db --remote --command "$verification_sql" --json > customer-access-verification.json
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const parsed = JSON.parse(fs.readFileSync('customer-access-verification.json', 'utf8'));
          const sets = Array.isArray(parsed) ? parsed : [parsed];
          const rows = sets.flatMap((item) => Array.isArray(item?.results) ? item.results : []);
          if (rows.length !== 1) throw new Error('Customer access schema verification returned an unexpected result.');
          const row = rows[0];
          if (Number(row.codes_table) !== 1 || Number(row.code_columns) !== 8 ||
              Number(row.sessions_table) !== 1 || Number(row.session_columns) !== 5 ||
              Number(row.email_index) !== 1 || Number(row.ip_index) !== 1 ||
              Number(row.session_index) !== 1) {
            throw new Error('Customer access schema verification failed: ' + JSON.stringify(row));
          }
          console.log('Verified Preview customer request access schema:', row);
          NODE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
