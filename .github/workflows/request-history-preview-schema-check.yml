name: Verify Request History Schema in Preview D1

on:
  push:
    branches: [cms-development]
    paths:
      - .github/workflows/request-history-preview-schema-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-preview-schema:
    name: Read-only request history schema check
    runs-on: ubuntu-24.04
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Preview database identity (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@4.157.0 d1 info yr-proservice-test-db --json > d1-preview-info.json
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const expectedName = 'yr-proservice-test-db';
          const expectedId = '7fca4ad0-3baa-4148-ad28-bfd2ef416c16';
          const info = JSON.parse(fs.readFileSync('d1-preview-info.json', 'utf8'));
          const values = [];
          const visit = (value) => {
            if (typeof value === 'string') values.push(value);
            else if (Array.isArray(value)) value.forEach(visit);
            else if (value && typeof value === 'object') Object.values(value).forEach(visit);
          };
          visit(info);
          if (!values.includes(expectedName) || !values.includes(expectedId)) {
            throw new Error('Preview D1 identity mismatch; refusing schema inspection.');
          }
          console.log('Verified Preview D1 identity:', expectedName, expectedId);
          NODE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify request history schema without writes
        shell: bash
        run: |
          set -euo pipefail
          verification_sql="$(cat <<'SQL'
          SELECT
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='request_status_history') AS history_table,
            (SELECT COUNT(*) FROM pragma_table_info('request_status_history') WHERE name IN ('id', 'request_id', 'reference', 'previous_status', 'new_status', 'actor_email', 'created_at')) AS history_columns,
            (SELECT COUNT(*) FROM pragma_foreign_key_list('request_status_history') WHERE "table" = 'requests' AND "from" = 'request_id' AND "to" = 'id' AND on_delete = 'RESTRICT') AS request_fk,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name='idx_request_status_history_reference') AS reference_index,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name='idx_request_status_history_request') AS request_index;
          SQL
          )"
          npx wrangler@4.157.0 d1 execute yr-proservice-test-db --remote --command "$verification_sql" --json > request-history-verification.json
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const parsed = JSON.parse(fs.readFileSync('request-history-verification.json', 'utf8'));
          const sets = Array.isArray(parsed) ? parsed : [parsed];
          const rows = sets.flatMap((item) => Array.isArray(item?.results) ? item.results : []);
          if (rows.length !== 1) throw new Error('Request history schema check returned an unexpected result.');
          const row = rows[0];
          if (Number(row.history_table) !== 1 || Number(row.history_columns) !== 7 ||
              Number(row.request_fk) !== 1 || Number(row.reference_index) !== 1 ||
              Number(row.request_index) !== 1) {
            throw new Error('Preview request history schema is incomplete: ' + JSON.stringify(row));
          }
          console.log('Preview request history schema is ready:', row);
          NODE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
