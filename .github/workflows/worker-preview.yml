
name: Worker Preview Deployment

on:
  push:
    branches:
      - production-release

permissions:
  contents: read

concurrency:
  group: worker-preview-production-release
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy Worker Preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Deploy Worker Preview
        run: npx wrangler@4.157.0 preview --config wrangler.worker-preview.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
