name: Apply Request History Migration to Preview D1

on:
  push:
    branches: [cms-development]
    paths:
      - migrations/0004_request_status_history.sql
      - .github/workflows/request-history-preview-migration.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: request-history-preview-d1-migration
  cancel-in-progress: false

jobs:
  migrate-preview:
    name: Apply request history schema to yr-pro-service-test-db only
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify Preview database identity (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@4.157.0 d1 info yr-pro-service-test-db --json > d1-preview-info.json
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const expectedName = 'yr-pro-service-test-db';
          const expectedId = '7fca4ad0-3baa-4148-ad28-bfd2ef416c16';
          let info;
          try {
            info = JSON.parse(fs.readFileSync('d1-preview-info.json', 'utf8'));
          } catch {
            throw new Error('Could not parse Wrangler D1 info JSON; refusing to run migration.');
          }
          const values = [];
          const visit = (value) => {
            if (typeof value === 'string') values.push(value);
            else if (Array.isArray(value)) value.forEach(visit);
            else if (value && typeof value === 'object') Object.values(value).forEach(visit);
          };
          visit(info);
          if (!values.includes(expectedName) || !values.includes(expectedId)) {
            throw new Error('Preview D1 identity mismatch. Expected ' + expectedName + ' and ' + expectedId + '. Refusing to execute SQL.');
          }
          console.log('Verified Preview D1 identity:', expectedName, expectedId);
          NODE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply request history migration to Preview only
        run: npx wrangler@4.157.0 d1 execute yr-pro-service-test-db --remote --file=migrations/0004_request_status_history.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify request history schema
        run: |
          npx wrangler@4.157.0 d1 execute yr-pro-service-test-db --remote --command "SELECT (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='request_status_history') AS history_table, (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name='idx_request_status_history_reference') AS reference_index, (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name='idx_request_status_history_request') AS request_index;" --json > request-history-verification.json
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const parsed = JSON.parse(fs.readFileSync('request-history-verification.json', 'utf8'));
          const sets = Array.isArray(parsed) ? parsed : [parsed];
          const rows = sets.flatMap((item) => Array.isArray(item?.results) ? item.results : []);
          if (rows.length !== 1) throw new Error('Request history verification returned an unexpected result.');
          const row = rows[0];
          if (Number(row.history_table) !== 1 || Number(row.reference_index) !== 1 || Number(row.request_index) !== 1) {
            throw new Error('Request history schema verification failed: ' + JSON.stringify(row));
          }
          console.log('Verified Preview request history schema:', row);
          NODE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
